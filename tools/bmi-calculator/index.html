<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BMI Calculator</title>

<body>
<header><h1>BMI Calculator</h1><nav><a href="/">Home</a></nav></header>
<main>

<p>BMI Calculator tool.</p>

<input id="input" placeholder="Enter value">
<button onclick="calc()">Calculate</button>
<p id="result"></p>

<script>
function calc(){
  let val = document.getElementById('input').value;
  document.getElementById('result').innerText = "Result: " + val;
}
</script>

<h2>About</h2>
<p>This tool helps with bmi calculator.</p>

<h3>FAQ</h3>
<p>Q: What is this?</p>
<p>A: A simple bmi calculator.</p>

</main>
