<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Converter - KM, Miles, KG and Pounds</title>
  <meta name="description" content="Free unit converter for length and weight. Convert km to miles, miles to km, kg to pounds and pounds to kg.">
  <link rel="canonical" href="https://example.com/tools/unit-converter/">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="wrap">
    <p class="breadcrumbs"><a href="/">Home</a> / Unit Converter</p>
    <section class="tool-box">
      <h1>Unit Converter</h1>
      <label for="value">Value</label>
      <input id="value" type="number" step="0.01" placeholder="10">
      <label for="type">Conversion</label>
      <select id="type">
        <option value="km-mi">Kilometers to Miles</option>
        <option value="mi-km">Miles to Kilometers</option>
        <option value="kg-lb">Kilograms to Pounds</option>
        <option value="lb-kg">Pounds to Kilograms</option>
      </select>
      <button onclick="convertUnit()">Convert</button>
      <div class="result" id="result">Converted value will appear here.</div>
    </section>
  </main>
  <script>
    function convertUnit() {
      const value = parseFloat(document.getElementById('value').value || '0');
      const type = document.getElementById('type').value;
      if (!value) return document.getElementById('result').textContent = 'Please enter a value.';
      const map = {
        'km-mi': value * 0.621371,
        'mi-km': value * 1.60934,
        'kg-lb': value * 2.20462,
        'lb-kg': value * 0.453592
      };
      document.getElementById('result').innerHTML = `<strong>Result:</strong> ${map[type].toFixed(4)}`;
    }
  </script>
</body>
</html>
